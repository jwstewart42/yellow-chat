name: Build Yellow Chat image

on:
  push:
    paths:
      - "yellow-chat/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: ver
        run: echo "version=$(grep -E '^version:' yellow-chat/config.yaml | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: yellow-chat
          push: true
          tags: |
            ghcr.io/jwstewart42/yellow-chat:${{ steps.ver.outputs.version }}
            ghcr.io/jwstewart42/yellow-chat:latest
